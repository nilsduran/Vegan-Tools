name: Supabase Keep-Alive

on:
  schedule:
    # Generate daily database activity; Supabase may pause free projects after
    # seven days with too little activity.
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping:
    name: Ping Supabase Database & API
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Supabase Project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ictqmbgzaxmixhkazdce.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          API_KEY="${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-$SUPABASE_SECRET_KEY}}"

          echo "Connecting to Supabase at: $SUPABASE_URL"

          if [ -n "$API_KEY" ]; then
            echo "Sending authenticated database and Auth health requests..."

            REST_CODE=$(curl --fail-with-body -sS -o /dev/null -w "%{http_code}" \
              -H "apikey: $API_KEY" \
              "$SUPABASE_URL/rest/v1/venues?select=id&limit=1")
            echo "Venues endpoint response HTTP code: $REST_CODE"

            AUTH_CODE=$(curl --fail-with-body -sS -o /dev/null -w "%{http_code}" \
              -H "apikey: $API_KEY" \
              "$SUPABASE_URL/auth/v1/health")
            echo "Auth health endpoint response HTTP code: $AUTH_CODE"

            echo "Keep-alive ping completed successfully."
          else
            echo "::error::Set SUPABASE_PUBLISHABLE_KEY (or SUPABASE_ANON_KEY) in GitHub repository secrets."
            exit 1
          fi
